on: 
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Check updated files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'backend/**'
              - 'infrastructure/**'
              - '.github/workflows/infra-*'

  test_terraform_plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-plan
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Initialize Terraform
        working-directory: infrastructure
        run: terraform init

      - name: Terraform format check
        working-directory: infrastructure
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: infrastructure
        run: terraform plan -no-color

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })